function clinicCards(q=''){return clinics.filter(c=>(c.name+' '+c.area).toLowerCase().includes(q.toLowerCase())).map((c,i)=>`<article class="card cliniccard"><div class="visual">✚</div><div class="eyebrow">EXAMPLE CLINIC</div><h2>${c.name}</h2><p>⌖ ${c.area} &nbsp; · &nbsp; ${c.distance}</p><p style="color:#d39c42">★ ${c.rating} <span style="color:#8a9aa8">(${c.reviews} example reviews)</span></p>${badge('Ophthalmology')}<p>Retinal screening · Specialist consultation</p>${btn('Request appointment →',`booking('${c.name}')`)}</article>`).join('')||'<p class="empty">No clinics match your search.</p>'}function table(){return `<div class="tablewrap"><table><thead><tr><th>PATIENT</th><th>REFERENCE</th><th>REASON FOR VISIT</th><th>STATUS</th><th></th></tr></thead><tbody>${people.map(p=>`<tr><td><span class="avatar" style="margin-right:10px;width:30px;height:30px">${p[0].split(' ').map(n=>n[0]).join('')}</span>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${badge(p[3])}</td><td><button onclick="patient('${p[0]}')">View →</button></td></tr>`).join('')}</tbody></table></div>`}function dashboard(){return heading('Good morning, Dr. Ahmed ☀','Here’s what’s happening at your clinic today.',btn('＋ New screening','uploadScreen()'))+`<div class="grid3">${stat('↗','New referrals','12','↑ 20% from last month')}${stat('▣','Pending appointments',8+requests.filter(r=>r.status==='Pending').length,'Ready for your review','blue')}${stat('✓','Completed visits','18','↑ 12% from last month')}</div><div class="layout"><section class="card"><div class="sectionhead"><h2>Appointments overview</h2><span class="badge blue">This week</span></div><p class="sub" style="font-size:11px">● Confirmed &nbsp; <span style="color:#9eb7ce">● Requested</span></p><svg class="chart" viewBox="0 0 600 220" role="img" aria-label="Illustrative weekly appointment chart"><g stroke="#eef2f5"><path d="M35 30H580M35 75H580M35 120H580M35 165H580"/></g><path d="M35 145L125 110L215 130L305 60L395 85L485 40L575 65L575 180H35 function modal(html){document.getElementById('modal').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="RetinaGuard dialog"><button class="modalclose" aria-label="Close dialog" onclick="closeModal()">×</button>${html}</section></div>`;setTimeout(()=>document.querySelector('.modal input,.modal button')?.focus(),0)}function closeModal(){document.getElementById('modal').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function toast(s){document.getElementById('toast').innerHTML=`<div class="toast">${escapeText(s)}</div>`;setTimeout(()=>document.getElementById('toast').innerHTML='',4000)}function booking(name){modal(`<div class="eyebrow">YOUR NEXT STEP</div><h2>Request an appointment</h2><p class="sub">${name}</p><form onsubmit="submitBooking(event,'${name}')"><label for="date">Preferred date</label><input id="date" type="date" min="${new Date().toISOString().slice(0,10)}" required><label for="time">Preferred time</label><select id="time"><option>09:00 AM</option><option>10:00 AM</option><option>11:00 AM</option><option>02:00 PM</option></select><label for="notes">Additional notes (optional)</label><textarea id="notes" placeholder="Any preferences for your visit?" rows="3"></textarea><p class="notice">This demo saves the request for this session only. No clinic is contacted.</p><button class="primary">Submit demo request →</button></form>`)}function submitBooking(e,name){e.preventDefault();requests.unshift({clinic:name,date:document.getElementById('date').value,time:document.getElementById('time').value,status:'Pending'});closeModal();go(mode==='patient'?'My appointments':'Appointments');toast('Demo request saved. You can review it in the clinic portal.')}function confirmAppt(){if(!requests.length){toast('Create a request in the patient portal first.');return}requests[0].status='Confirmed';render();toast('Appointment confirmed in this demo session.')}function appointmentDetails(){modal('<h2>Appointment details</h2><p class="sub">Your follow-up visit</p><br>'+appt().replace(/<button[\s\S]*?<\/button>/,'')+'<p class="notice">This appointment is illustrative. No actual booking has been made.</p>')}function screening(){modal('<div class="eyebrow">SCREENING SUMMARY</div><h2>Follow-up recommended</h2><p>Reference RG-2026-1042 · 12 October 2026</p><p>This example shows how a screening referral appears in your portal. Your eye specialist reviews actual screening results and determines your care plan.</p><p class="notice">Demo result only. No retinal image has been analyzed.</p>'+btn('Find a clinic',"closeModal();go('Find clinics')"))}function notifications(){modal('<h2>Your notifications</h2><p>♧ Your follow-up appointment is awaiting confirmation.</p><p class="notice">Example notification. Live reminders are not connected.</p>')}function patient(name){modal(`<div class="eyebrow">PATIENT RECORD · DEMO</div><h2>${name}</h2><p>Last screening: 12 October 2026</p><h3>Referral history</h3><p>Screening completed → Referral created → Appointment review</p><p class="notice">Illustrative patient record. No real patient information.</p>${btn('Review appointments',"closeModal();go('Appointments')")}`)}function uploadScreen(){modal('<h2>New screening</h2><p class="sub">Preview a retinal image before connecting your screening service.</p><label for="retinal">Choose a retinal image</label><input id="retinal" type="file" accept="image/*" onchange="previewImage(this)"><div id="imagepreview"></div><p class="notice">Images stay in your browser. AI analysis is not connected and no diagnosis is generated.</p>')}function previewImage(input){const f=input.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Please choose an image.');return}const img=document.createElement('img');img.style='max-width:100%;max-height:220px;margin-top:20px;border-radius:8px';img.src=URL.createObjectURL(f);img.onload=()=>URL.revokeObjectURL(img.src);document.getElementById('imagepreview').replaceChildren(img)}function message(type,name){modal(`<h2>${type}</h2><p>Hello ${name}, please check your RetinaGuard portal for your appointment details and next steps.</p><p class="notice">Template preview only. No message has been sent.</p>`)}function profile(){modal('<h2>Edit profile</h2><form onsubmit="event.preventDefault();document.getElementById(\'userName\').textContent=document.getElementById(\'displayname\').value;closeModal();toast(\'Display name updated for this session.\')"><label for="displayname">Display name</label><input id="displayname" required maxlength="80" value="Ahmed Mohamed"><button class="primary">Save display name</button></form>')}function article(i){const a=[['Understanding retinal screening','A retinal screening captures images of the back of your eye. These images can be reviewed by a qualified eye care professional.','Ask your clinician what your results mean and when you should return. RetinaGuard’s demo shows how that follow-up can be organized.'],['Prepare for your appointment','Keep previous screening reports and your medication list together. Write down the questions you want to ask.','Check your appointment time, clinic location, and any preparation instructions with your provider.'],['Stay connected to your care','Your care journey brings screening, referral, and appointment information together.','After a visit, ask your clinic to explain the follow-up plan and confirm when your next visit should be.']][i];modal(`<div class="eyebrow">EYE HEALTH GUIDE</div><h2>${a[0]}</h2><p>${a[1]}</p><p>${a[2]}</p>`)}document.getElementById('support').onclick=e=>{e.preventDefault();modal('<h2>Here to help</h2><p>Use Find clinics to preview an appointment request, then switch to the Clinic portal to confirm it.</p><p class="notice">Support services are not connected in this frontend demo.</p>')};render();

function escapeText(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalizePhone(value){return value.replace(/[٠-٩]/g,n=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(n))).replace(/[\s()\-]/g,'').replace(/^0020/,'+20').replace(/^01/,'+201')}
function validPhone(value){return /^\+201[0125]\d{8}$/.test(normalizePhone(value))}
render=function(){originalRender();const account=activeAccount;if(account&&mode==='patient'){document.getElementById('userName').textContent=account.name;document.getElementById('userRole').textContent='Patient · Demo session';document.querySelectorAll('.avatar').forEach(a=>{if(a.closest('table'))return;a.textContent=account.name.trim().split(/\s+/).slice(0,2).map(n=>n[0]).join('').toUpperCase()});if(page==='Overview'){document.querySelector('h1').textContent='Hello, '+account.name.split(' ')[0]+' ☀';document.querySelector('.content').insertAdjacentHTML('afterbegin','<p class="notice">Your contact profile is ready. Screening results, appointments, and medical history below remain example data.</p>')}if(page==='My profile'){document.getElementById('app').innerHTML=heading('My profile','Your contact information, in one place.')+`<section class="card" style="max-width:650px"><h2>${escapeText(account.name)}</h2><div class="profilefields"><div><small>Email address</small><b>${escapeText(account.email)}</b></div><div><small>Phone number</small><b>${escapeText(account.phone)}</b></div></div><p class="notice">Demo profile held in memory for this open page only. Refreshing clears it. No email or phone verification has been performed.</p>${btn('Edit contact details','profile()')}${btn('Sign out','signOut()',true)}</section>`}}else if(mode==='patient'){document.getElementById('userName').textContent='Ahmed Mohamed';document.getElementById('userRole').textContent='Example patient · Demo'}if(!document.getElementById('accountActions')){document.querySelector('.sidebottom').insertAdjacentHTML('beforeend','<div class="accountactions" id="accountActions"></div>')}document.getElementById('accountActions').innerHTML=activeAccount?btn('Sign out','signOut()',true):btn('Sign in',"showAuth('signin')",true)+btn('Sign up',"showAuth('signup')");};
function showAuth(view='signup'){authView=view;const signup=view==='signup';document.getElementById('auth').innerHTML=`<section class="authscreen" aria-label="Patient account"><div class="authstory"><div class="brand">${eye}<div>RetinaGuard<small>YOUR VISION. OUR MISSION.</small></div></div><div><div class="eyebrow">CONNECTED EYE CARE</div><div class="authart">${eye}</div><h1>Your eyes matter.<br>So does your<br>next step.</h1><p>One place for your screening journey, nearby clinics, and follow-up appointments.</p></div><footer>From screening to completed eye care.</footer></div><div class="authpanel"><form id="accountForm" onsubmit="submitAccount(event)" novalidate><div class="eyebrow">PATIENT PORTAL</div><h2>${signup?'Start your care journey':'Welcome back'}</h2><p class="sub">${signup?'Create your patient profile to get started.':'Sign in to your patient profile.'}</p><div class="switch"><button type="button" class="${!signup?'active':''}" onclick="showAuth('signin')">Sign in</button><button type="button" class="${signup?'active':''}" onclick="showAuth('signup')">Sign up</button></div>${signup?'<label for="authName">Full name</label><input id="authName" name="name" autocomplete="name" placeholder="Your full name" maxlength="100" required>':''}<label for="authEmail">Email address</label><input id="authEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>${signup?'<label for="authPhone">Mobile number</label><input id="authPhone" name="phone" type="tel" autocomplete="tel" placeholder="010 1234 5678" required><p class="helper">Egyptian mobile number, starting with 010, 011, 012, or 015.</p>':''}<label for="authPassword">Password</label><div class="passwordrow"><input id="authPassword" name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="${signup?'At least 8 characters':'Enter your password'}" minlength="8" maxlength="128" required><button type="button" onclick="togglePassword(this)">Show</button></div>${signup?'<label for="authConfirm">Confirm password</label><input id="authConfirm" type="password" autocomplete="new-password" placeholder="Re-enter your password" required><label class="check"><input id="demoConsent" type="checkbox" required><span>I understand this is a temporary demo. I will use example contact details and a password I do not use elsewhere.</span></label>':'<p class="helper">Use a demo account created on this open page. Reloading clears all demo accounts.</p>'}<div id="authError" class="autherror" role="alert"></div><button class="primary" id="authSubmit">${signup?'Create demo account':'Sign in to demo'} &nbsp; →</button><p class="authnotice">Frontend preview only. Accounts are not saved to a server and do not work across devices. No messages are sent.</p><div class="authdemo"><button type="button" onclick="enterDemo()">Explore the demo without an account →</button></div></form></div></section>`;document.querySelector('body > .sidebar').inert=true;document.querySelector('main').inert=true;document.body.style.overflow='hidden';document.getElementById(signup?'authName':'authEmail').focus()}

function togglePassword(button){const input=document.getElementById('authPassword');input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'Show':'Hide'}
async function digestPassword(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function submitAccount(event){event.preventDefault();const form=document.getElementById('accountForm'),error=document.getElementById('authError');error.textContent='';if(!form.reportValidity())return;const email=document.getElementById('authEmail').value.trim().toLowerCase(),password=document.getElementById('authPassword').value;const signup=authView==='signup';let account;if(signup){const name=document.getElementById('authName').value.trim(),phone=normalizePhone(document.getElementById('authPhone').value);if(name.length<2){error.textContent='Please enter your full name.';return}if(!validPhone(phone)){error.textContent='Enter a valid Egyptian mobile number, such as 01012345678 or +201012345678.';return}if(password!==document.getElementById('authConfirm').value){error.textContent='Your passwords do not match.';return}if(demoAccounts.has(email)){error.textContent='This email already has a demo account. Choose Sign in.';return}account={name,email,phone,salt:crypto.getRandomValues(new Uint8Array(16))}}else{account=demoAccounts.get(email);if(!account){error.textContent='Email or password is incorrect, or this demo account has expired. Create an account on this page first.';return}}const button=document.getElementById('authSubmit');button.disabled=true;button.textContent='Please wait…';try{const digest=await digestPassword(password,account.salt);if(signup){account.digest=digest;demoAccounts.set(email,account)}else if(account.digest!==digest){error.textContent='Email or password is incorrect.';return}activeAccount=account;requests=[];hideAuth();setMode('patient');go('Learn & protect');toast(signup?'Demo profile created. Your contact details are ready.':'Welcome back, '+account.name.split(' ')[0]+'.')}catch(e){error.textContent='Unable to start this demo session. Please try again in a secure browser.'}finally{button.disabled=false;button.textContent=signup?'Create demo account →':'Sign in to demo →'}}

profile=function(){if(!activeAccount){showAuth('signup');return}modal(`<h2>Edit contact details</h2><form onsubmit="saveContact(event)"><label for="profileName">Full name</label><input id="profileName" autocomplete="name" value="${escapeText(activeAccount.name)}" minlength="2" maxlength="100" required><label for="profileEmail">Email address</label><input id="profileEmail" type="email" autocomplete="email" value="${escapeText(activeAccount.email)}" required><label for="profilePhone">Mobile number</label><input id="profilePhone" type="tel" autocomplete="tel" value="${escapeText(activeAccount.phone)}" required><p id="profileError" class="autherror" role="alert"></p><button class="primary">Save contact details</button></form>`)};
function saveContact(e){e.preventDefault();const name=document.getElementById('profileName').value.trim(),email=document.getElementById('profileEmail').value.trim().toLowerCase(),phone=normalizePhone(document.getElementById('profilePhone').value);const error=document.getElementById('profileError');if(name.length<2){error.textContent='Enter your full name.';return}if(!validPhone(phone)){error.textContent='Enter a valid Egyptian mobile number.';return}if(email!==activeAccount.email&&demoAccounts.has(email)){error.textContent='This email already belongs to another demo account.';return}demoAccounts.delete(activeAccount.email);Object.assign(activeAccount,{name,email,phone});demoAccounts.set(email,activeAccount);closeModal();render();toast('Contact details updated for this demo session.')}

function awarenessReferencePage(){return `<div class="awintro" style="margin-top:0"><div class="eyebrow" style="margin:0">WELCOME TO YOUR EYE HEALTH JOURNEY</div><span class="awtopic">A 2-minute guide</span></div>
<section class="awhero"><div><div class="eyebrow">DIABETES & YOUR VISION</div><h1>Protect the little things<br>you love to see.</h1><p>Diabetes can harm your eyesight, even before you notice a change. Understanding the risk is your first step toward protecting your vision.</p><button class="primary" onclick="document.getElementById('whyEyes').scrollIntoView({block:'start'})">Understand your eye health ↓</button></div><div class="awvisual"><svg viewBox="0 0 340 210" role="img" aria-label="Decorative eye illustration"><circle cx="170" cy="105" r="98" fill="#d5ede3"/><circle cx="170" cy="105" r="79" fill="none" stroke="#bddfd3" stroke-dasharray="3 8"/><path d="M40 105Q170-27 300 105Q170 237 40 105Z" fill="white" stroke="#285871" stroke-width="4"/><circle cx="170" cy="105" r="49" fill="#008e81"/><circle cx="170" cy="105" r="31" fill="#174963"/><circle cx="182" cy="91" r="12" fill="#fff"/><path d="M42 164l7 7 13-17" fill="none" stroke="#008e81" stroke-width="4"/><path d="M280 39v20m-10-10h20" stroke="#008e81" stroke-width="3"/></svg><small>Awareness today. Care for tomorrow.</small></div></section>
<div id="whyEyes" class="awintro"><h2>How can diabetes affect your eyes?</h2><span class="awtopic">Understand the connection</span></div>
<div class="awgrid"><article class="card"><span class="iconbox">◎</span><h3>It starts with tiny vessels</h3><p>Over time, high blood sugar can damage the small blood vessels supplying the retina—the light-sensitive tissue at the back of your eye.</p></article><article class="card"><span class="iconbox blue">◉</span><h3>The retina can be harmed</h3><p>Damaged vessels may leak or bleed. This is diabetic retinopathy. Swelling in the macula, which supports sharp central vision, is called diabetic macular edema.</p></article><article class="card"><span class="iconbox orange">♡</span><h3>Everyday vision can change</h3><p>Reading, recognizing faces, and seeing detail may become harder. Advanced disease can cause permanent sight loss. Early detection and treatment can help protect vision.</p></article></div>
<div class="awnote"><span style="font-size:24px">◎</span><div><strong>Clear vision doesn’t always mean healthy eyes.</strong><br>Early diabetic retinopathy often causes no symptoms. Don’t wait for blurred vision before arranging an eye check.</div></div>
<div class="awsplit"><section class="card"><div class="eyebrow">NOTICE THE CHANGES</div><h2>What might you notice?</h2><ul class="awlist"><li>Blurred or wavy vision</li><li>Dark spots or floating strings</li><li>Dark areas or difficulty seeing colors</li></ul><p>Discuss changes with an eye doctor. Symptoms alone cannot confirm or rule out retinopathy. Diabetes also increases the risk of cataracts and glaucoma.</p></section><section class="card"><div class="eyebrow">SMALL STEPS, LASTING CARE</div><h2>Make eye health part of your routine</h2><ul class="awlist"><li><b>01</b>Arrange regular comprehensive dilated eye exams.</li><li><b>02</b>Manage blood sugar, blood pressure, and cholesterol with your care team.</li><li><b>03</b>Follow prescribed treatment and seek help to stop smoking.</li></ul><p>Many people need yearly exams; your clinician should set the timing for your diabetes type and eye health.</p></section></div>
<aside class="awurgent"><h3>Sudden vision changes need urgent care</h3><p>Sudden vision loss, new flashes, many new floaters, or a curtain-like shadow need immediate medical attention. Contact an eye emergency service or go to an emergency department. Don’t wait for a routine RetinaGuard booking.</p></aside>
<section class="awplatform"><div class="eyebrow">MEET RETINAGUARD</div><h2>Awareness is the start. Follow-up is the next step.</h2><p>RetinaGuard is designed to help patients and clinics stay connected throughout the eye care journey.</p><div class="awgrid"><article><span>01 / UNDERSTAND</span><h3>Learn about your eyes</h3><p>Start with clear information and keep your contact profile up to date.</p></article><article><span>02 / CONNECT</span><h3>Find your next appointment</h3><p>Explore clinics and request a visit with an eye care professional.</p></article><article><span>03 / FOLLOW THROUGH</span><h3>Keep your care in view</h3><p>Follow appointment status and the next steps in your referral journey.</p></article></div><p>Planned AI-assisted retinal screening supports clinician review; it does not replace a diagnosis or a complete eye examination. This frontend demo does not analyze images or make real bookings.</p><div class="awactions">${btn('Find an eye care clinic →',"go('Find clinics')")}${btn('Continue to my dashboard',"go('Overview')",true)}</div></section>
<section class="awfaq"><h2 style="margin-bottom:14px">A few questions you may have</h2><details><summary>Can I return to this guide later?</summary><p>Yes. Open “Learn & protect” in your patient portal whenever you want to read it again.</p></details><details><summary>Is RetinaGuard giving me a diagnosis?</summary><p>No. This guide is educational. A qualified eye care professional assesses your eyes and recommends your care plan. The current demo has no live AI screening service.</p></details><details><summary>What happens after I choose a clinic?</summary><p>You can try an appointment request and see its status in the demo. Live clinic bookings and reminders are not connected yet.</p></details></section>

function awarenessPage(){const positions=[[50,12],[84,38],[71,80],[29,80],[16,38]];const reference=awarenessReferencePage();return `<header class="cycleheading"><div><div class="eyebrow">LEARN & PROTECT / YOUR CARE CYCLE</div><h1>Better vision starts with<br><em>a circle of care.</em></h1><p>Learn. Take action. Stay connected. Explore five steps that keep your eye health part of everyday life.</p></div><span class="cyclepill">↻ &nbsp; A journey worth repeating</span></header><section class="cyclebox" aria-label="Interactive eye care cycle"><div class="orbitarea"><div class="orbit"><svg class="orbitlines" viewBox="0 0 470 470" aria-hidden="true"><circle cx="235" cy="235" r="164" fill="none" stroke="#d6e6dc" stroke-width="2" stroke-dasharray="4 8"/><circle cx="235" cy="235" r="110" fill="none" stroke="#dfece4"/><g fill="#8aaf9e"><path d="M328 92l13 6-11 8Z"/><path d="M395 255l-4 14-10-10Z"/><path d="M242 397l-14 2 5-13Z"/><path d="M91 319l-9-11 14-3Z"/><path d="M92 147l7-13 7 12Z"/></g></svg><div class="orbitcore">${eye}<strong>RetinaGuard</strong><small>Your vision.<br>At the heart of every step.</small></div>${careCycle.map((s,i)=>`<button class="orbitnode ${i===careStep?'active':''}" style="--x:${positions[i][0]}%;--y:${positions[i][1]}%" onclick="selectCareStep(${i})" aria-pressed="${i===careStep}" aria-controls="cyclePanel" aria-label="Step ${i+1}: ${s.label}"><span class="nodeicon" aria-hidden="true">${s.icon}</span><span class="nodelabel">${s.label}</span><span class="nodecount">0${i+1}</span></button>`).join('')}</div><p class="orbitcaption">Choose any step to explore your care journey</p></div><section id="cyclePanel" class="cyclepanel" aria-label="Selected care step" aria-live="polite" tabindex="-1">${cyclePanel()}</section></section><div class="cyclebottom"><article class="cyclemini"><span class="iconbox">◎</span><div><h3>Clear vision isn’t the whole story</h3><p>Retinal changes can begin without noticeable symptoms.</p></div></article><article class="cycle function cairoNow(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));return {day:`${o.year}-${o.month}-${o.day}`,time:`${o.hour}:${o.minute}`}}
function bookingDates(){const today=cairoNow().day;return Array.from({length:14},(_,i)=>{const d=new Date(today+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+i);return d.toISOString().slice(0,10)})}
function dayLabel(day){return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(day+'T12:00:00Z'))}
function slotsFor(provider,day){const now=cairoNow();if(day<now.day||new Date(day+'T12:00:00Z').getUTCDay()===5)return [];const start=provider.id==='clear'?10:9;return Array.from({length:8},(_,i)=>{const time=String(start+i).padStart(2,'0')+':00';const seeded=(Number(day.slice(-2))+i+demoProviders.indexOf(provider))%4===0;const taken=demoBookings.some(b=>b.provider===provider.id&&b.day===day&&b.time===time&&b.status!=='Cancelled');return {time,available:!seeded&&!taken&&(day!==now.day||time>now.time)}})}
function firstAvailable(p){for(const day of bookingDates()){const slot=slotsFor(p,day).find(s=>s.available);if(slot)return {day,time:slot.time}}return null}
function kmFrom(p){const rad=n=>n*Math.PI/180;const [lat,lng]=searchPoint;const a=Math.sin(rad(p.lat-lat)/2)**2+Math.cos(rad(lat))*Math.cos(rad(p.lat))*Math.sin(rad(p.lng-lng)/2)**2;return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function providerCards(){const list=demoProviders.filter(p=>(p.name+' '+p.area).toLowerCase().includes(clinicQuery.toLowerCase())).filter(p=>!onlyAvailable||slotsFor(p,cairoNow().day).some(s=>s.available)).sort((a,b)=>kmFrom(a)-kmFrom(b));return list.map(p=>{const next=firstAvailable(p);return `<article class="card cliniccard"><div class="visual">✚</div><h2>${p.name}</h2><p>⌖ ${p.area} · ${kmFrom(p)<.1?'< 0.1':kmFrom(p).toFixed(1)} km approx.</p><div class="clinicdetail">${p.specialty}<br>${p.hours}<br><strong>EGP ${p.fee}</strong> · Example consultation fee</div><div class="availabilitytag">${next?'Next demo slot: '+dayLabel(next.day)+' · '+next.time:'No demo slots in the next 14 days'}</div>${btn('See schedule & book →',`openBooking('${p.id}')`)}</article>`}).join('')||'<div class="card bookingempty">No matching clinics with these filters. Try another area or turn off “Available today.”</div>'}
function findClinicsPage(){return heading('Your next appointment, closer.','Explore nearby demo providers and choose a time that works for you.')+`<div class="bookingbanner"><b>Realistic booking preview · Demo availability</b><br>Providers, coordinates, fees, and schedules are illustrative. No clinic is contacted and no payment is taken. Bookings last only while this page stays open.</div><div class="locationbar"><select aria-label="Choose your area" onchange="changeArea(this.value)">${Object.keys(searchAreas).map(a=>`<option ${selectedArea===a?'selected':''}>${a}</option>`).join('')}</select>${btn('⌖ Use my location','locateClinics()',true)}<input aria-label="Search clinic or area" placeholder="Search clinic or area…" value="${escapeText(clinicQuery)}" oninput="clinicQuery=this.value;refreshProviders()"></div><div class="locationstatus" id="locationStatus" role="status">${escapeText(locationMessage)}</div><label style="display:block;font-size:12px;margin-bottom:22px"><input type="checkbox" ${onlyAvailable?'checked':''} onchange="onlyAvailable=this.checked;refreshProviders()"> Available today <span style="color:#93a49b">· all times are Cairo local time</span></label><div class="clinics" id="providerCards">${providerCards()}</div>`}

function changeArea(area){selectedArea=area;searchPoint=searchAreas[area];locationMessage='Distances from '+area+' center to illustrative clinic coordinates. Straight-line distance, not driving distance.';document.getElementById('locationStatus').textContent=locationMessage;refreshProviders()}
function locateClinics(){const status=document.getElementById('locationStatus');if(!navigator.geolocation){status.textContent='Location is not supported here. Please select your area instead.';return}status.textContent='Waiting for location permission… Your coordinates stay in this page.';navigator.geolocation.getCurrentPosition(pos=>{searchPoint=[pos.coords.latitude,pos.coords.longitude];locationMessage='Sorted by distance from your location to demo clinic coordinates. Your position is held only in memory. Distances are not driving distances.';if(page==='Find clinics'){document.getElementById('locationStatus').textContent=locationMessage;refreshProviders()}},()=>{locationMessage='Location is unavailable or permission was declined. Select an area to continue.';if(page==='Find clinics')document.getElementById('locationStatus').textContent=locationMessage},{enableHighAccuracy:false,timeout:10000,maximumAge:60000})}

t(d.phone)}" placeholder="01012345678"></div></div><p id="bookingError" class="autherror" role="alert"></p><p class="notice">Please use example contact details. Nothing is sent to a clinic or stored on a server.</p><div class="bookactions"><button type="button" class="secondary" onclick="saveBookingFields();bookingDraft.step=1;showBooking()">← Schedule</button><button class="primary">Review appointment →</button></div></form>`}else{body=`${bookingReview(d,p)}<p class="notice">This reserves a demo slot in this open page only. There is no real appointment, payment, email, or SMS.</p><div class="bookactions"><button class="secondary" onclick="bookingDraft.step=2;showBooking()">← Edit details</button><button class="primary" onclick="finishBooking()">Confirm demo booking ✓</button></div>`}modal(`<div class="eyebrow">DEMO APPOINTMENT</div><h2>${p.name}</h2><p class="sub">${p.address}</p><div class="bookingsteps">${['Date & time','Your details','Review & book'].map((t,i)=>`<span class="${i+1===d.step?'current':''}">${i+1}. ${t}</span>`).join('')}</div>${body}`);document.querySelector('.modal').classList.add('bookingmodal')}

function exampleReadings(){return [0,1,2,3].map((n)=>{const date=new Date(cairoNow().day+'T12:00:00Z');date.setUTCDate(date.getUTCDate()-(3-n)*45);return {id:'example-'+n,date:date.toISOString().slice(0,10),weight:[84,83.5,82.8,82.4][n],a1c:[8.1,7.9,7.6,7.4][n],sys:[136,132,134,130][n],dia:[86,84,85,82][n]}})}
function visibleHealthReadings(){const list=showHealthExample?exampleReadings():healthAccount()?.readings||[];const end=new Date(cairoNow().day+'T12:00:00Z').getTime(),cutoff=healthRange==='all'?-Infinity:end-Number(healthRange)*86400000;return list.filter(r=>new Date(r.date+'T12:00:00Z').getTime()>=cutoff).slice().sort((a,b)=>a.date.localeCompare(b.date))}
function healthSeries(rows,key){return rows.filter(r=>r[key]!==null&&r[key]!==undefined).map(r=>({date:r.date,value:r[key]}))}
function latestHealth(rows,key,unit){const data=healthSeries(rows,key);if(!data.length)return '<strong class="healthlatest">—</strong><p class="healthdelta">No readings in this period</p>';const last=data.at(-1),delta=last.value-data[0].value;return `<strong class="healthlatest">${last.value} <small style="font-size:12px;font-weight:400">${unit}</small></strong><p class="healthdelta">${dayLabel(last.date)}${data.length>1?' · '+(delta>0?'+':'')+Number(delta.toFixed(2))+' '+(key==='a1c'?'percentage points':unit)+' from first reading':''}</p>`}
function healthChart(rows,keys,unit,label){const series=keys.map(k=>healthSeries(rows,k));const points=series.flat();if(!points.length)return '<div class="healthblank">Add a reading to start your trend.</div>';const values=points.map(p=>p.value),times=points.map(p=>Date.parse(p.date+'T12:00:00Z'));const minT=Math.min(...times),maxT=Math.max(...times);const low=Math.min(...values),high=Math.max(...values),pad=Math.max((high-low)*.2,keys[0]==='a1c'?.2:2),minY=Math.max(0,low-pad),maxY=high+pad;const x=t=>minT===maxT?300:60+(t-minT)/(maxT-minT)*490,y=v=>185-(v-minY)/(maxY-minY)*150;const colors=['#008e81','#768bc3'];const ticks=Array.from({length:4},(_,i)=>minY+(maxY-minY)*i/3);const dates=[...new Set(points.map(p=>p.date))].sort();const labels=dates.length<=3?dates:[dates[0],dates[Math.floor(dates.length/2)],dates.at(-1)];return `<svg class="healthchart" viewBox="0 0 610 235" role="img" aria-label="${label} over time, ${unit}. Exact values are available in the reading history."><text x="10" y="17">${unit}</text>${ticks.map(t=>`<line x1="60" x2="550" y1="${y(t)}" y2="${y(t)}" stroke="#e9efeb"/><text x="48" y="${y(t)+4}" text-anchor="end">${Number(t.toFixed(1))}</text>`).join('')}${series.map((data,i)=>`${data.length>1?`<polyline points="${data.map(p=>x(Date.parse(p.date+'T12:00:00Z'))+','+y(p.value)).join(' ')}" fill="none" stroke="${colors[i]}" stroke-width="2.5"/>`:''}${data.map(p=>`<circle tabindex="0" cx="${x(Date.parse(p.date+'T12:00:00Z'))}" cy="${y(p.value)}" r="4.5" fill="${colors[i]}"><title>${p.date}: ${keys[i]==='sys'?'Systolic ':keys[i]==='dia'?'Diastolic ':''}${p.value} ${unit}</title></circle>`).join('')}`).join('')}${labels.map(d=>`<text x="${x(Date.parse(d+'T12:00:00Z'))}" y="213" text-anchor="middle">${new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'})}</text>`).join('')}</svg>${points.length===1?'<p class="healthdelta">One reading recorded. Add another date to see a trend.</p>':''}`}
function healthPage(){const rows=visibleHealthReadings(),h=healthAccount();return heading('Your health, over time.','Track your measurements and bring a clearer history to your next visit.',btn('＋ Add reading','editHealthReading()'))+`<div class="bookingbanner">Demo health tracker · Use example readings only. Information stays in this open page and disappears on refresh. Charts show recorded values, not a diagnosis or a treatment recommendation.</div><div class="healthprofile"><div><h3>Diabetes type</h3><p>${escapeText(h?.type||'Not specified')} · Saved with your demo profile</p></div>${btn('Update diabetes type','editDiabetesType()',true)}</div><div class="healthtoolbar"><label>Show <select aria-label="Health chart period" onchange="healthRange=this.value;render()">${[['all','All time'],['30','Last 30 days'],['90','Last 90 days'],['180','Last 6 months'],['365','Last year']].map(([v,t])=>`<option value="${v}" ${healthRange===v?'selected':''}>${t}</option>`).join('')}</select></label><label style="font-size:12px"><input type="checkbox" ${showHealthExample?'checked':''} onchange="showHealthExample=this.checked;render()"> Preview example trends</label></div>${showHealthExample?'<div class="healthsample">Illustrative sample data—not your readings. Turn off “Preview example trends” to return to your own entries.</div>':''}<div class="healthcharts"><section class="card"><h2>Weight</h2>${latestHealth(rows,'weight','kg')}${healthChart(rows,['weight'],'kg','Weight')}</section><section class="card"><h2>HbA1c · <span lang="ar" dir="rtl">السكر التراكمي</span></h2>${latestHealth(rows,'a1c','%')}${healthChart(rows,['a1c'],'%','HbA1c')}</section><section class="card wide"><div class="sectionhead"><h2>Blood pressure</h2><span class="sub">mmHg</span></div><div class="healthlegend"><span style="--legend:#008e81">Systolic (upper number)</span><span style="--legend:#768bc3">Diastolic (lower number)</span></div>${latestHealth(rows,'sys','mmHg systolic')}${healthChart(rows,['sys','dia'],'mmHg','Systolic and diastolic blood pressure')}</section></div><section class="card"><div class="sectionhead"><h2>Measurement history</h2><span class="sub">${rows.length} entries in selected period</span></div><div class="tablewrap"><table class="healthhistory"><thead><tr><th>DATE</th><th>WEIGHT · kg</th><th>HbA1c · %</th><th>BP · mmHg</th><th>ACTIONS</th></tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr><td>${dayLabel(r.date)}</td><td>${r.weight??'—'}</td><td>${r.a1c??'—'}</td><td>${r.sys!==null&&r.sys!==undefined?r.sys+'/'+r.dia:'—'}</td><td>${showHealthExample?'Example only':`<button onclick="editHealthReading('${r.id}')">Edit</button><button onclick="deleteHealthReading('${r.id}')">Delete</button>`}</td></tr>`).join('')||'<tr><td colspan="5">No readings in this period. Add your first demo measurement or preview example trends.</td></tr>'}</tbody></table></div></section><p class="healthfoot">HbA1c reflects average blood sugar over roughly 2–3 months; enter the percentage from your test report. Each metric has its own scale, and missing measurements are left blank. Connecting lines show recorded trends, not values measured between visits. Discuss readings and personal targets with your clinician. <a href="https://www.niddk.nih.gov/health-information/diagnostic-tests/a1c-test" target="_blank" rel="noopener noreferrer">About HbA1c — NIDDK</a></p>`}

function editDiabetesType(){if(!requireHealthProfile())return;const h=healthAccount();modal(`<h2>Your diabetes type</h2><p class="sub">Choose the type diagnosed by your clinician, or “Unknown / not sure.”</p><form onsubmit="event.preventDefault();healthAccount().type=document.getElementById('diabetesType').value;closeModal();render()"><label for="diabetesType">Diabetes type</label><select id="diabetesType">${diabetesTypes.map(t=>`<option ${t===h.type?'selected':''}>${t}</option>`).join('')}</select><button class="primary">Save profile detail</button></form>`)}
function editHealthReading(id){if(!requireHealthProfile())return;const r=healthAccount().readings.find(r=>r.id===id)||{};modal(`<div class="eyebrow">DEMO HEALTH READING</div><h2>${id?'Edit':'Add'} a measurement</h2><p class="sub">Enter at least one measurement. Leave others blank.</p><form onsubmit="saveHealthReading(event,'${id||''}')"><div class="healthform"><div class="full"><label for="healthDate">Measurement date</label><input id="healthDate" type="date" max="${cairoNow().day}" value="${r.date||cairoNow().day}" required></div><div><label for="healthWeight">Weight (kg)</label><input id="healthWeight" type="number" min="1" max="500" step="0.1" value="${r.weight??''}" placeholder="e.g. 82.5"></div><div><label for="healthA1c">HbA1c (%) · السكر التراكمي</label><input id="healthA1c" type="number" min="1" max="30" step="0.1" value="${r.a1c??''}" placeholder="e.g. 7.2"></div><div><label for="healthSys">Systolic BP (mmHg)</label><input id="healthSys" type="number" min="30" max="350" step="1" value="${r.sys??''}" placeholder="Upper number"></div><div><label for="healthDia">Diastolic BP (mmHg)</label><input id="healthDia" type="number" min="20" max="250" step="1" value="${r.dia??''}" placeholder="Lower number"></div></div><p class="helper">For blood pressure, enter both numbers. Input limits catch entry errors; they are not medical target ranges.</p><p id="healthError" class="autherror" role="alert"></p><button class="primary">Save demo reading</button></form>`)}
function validateHealthReading(r,rows,id){if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!Number.isFinite(Date.parse(r.date))||new Date(r.date).toISOString().slice(0,10)!==r.date||r.date>cairoNow().day)return 'Choose a valid date that is not in the future.';if(['weight','a1c','sys','dia'].every(k=>r[k]===null))return 'Enter at least one measurement.';for(const [k,min,max] of [['weight',1,500],['a1c',1,30],['sys',30,350],['dia',20,250]])if(r[k]!==null&&(!Number.isFinite(r[k])||r[k]<min||r[k]>max))return 'Check your measurement values and units.';if((r.sys===null)!==(r.dia===null))return 'Enter both systolic and diastolic blood pressure.';if(r.sys!==null&&(!Number.isInteger(r.sys)||!Number.isInteger(r.dia)||r.sys<=r.dia))return 'Check blood pressure: use whole numbers with systolic higher than diastolic.';if(rows.some(x=>x.date===r.date&&x.id!==id))return 'An entry already exists for this date. Edit it to add or change measurements.';return ''}
function saveHealthReading(e,id){e.preventDefault();if(!activeAccount)return;const value=name=>{const v=document.getElementById(name).value;return v===''?null:Number(v)};const r={id:id||'reading-'+(++healthSequence),date:document.getElementById('healthDate').value,weight:value('healthWeight'),a1c:value('healthA1c'),sys:value('healthSys'),dia:value('healthDia')};const h=healthAccount(),error=validateHealthReading(r,h.readings,id);if(error){document.getElementById('healthError').textContent=error;return}const idx=h.readings.findIndex(x=>x.id===id);if(id&&idx<0)return;if(idx>=0)h.readings[idx]=r;else h.readings.push(r);showHealthExample=false;healthRange='all';closeModal();go('Health dashboard');toast('Demo measurement saved.')}

editHealthReading=function(id){if(!requireHealthProfile())return;const r=healthAccount().readings.find(r=>r.id===id),kind=r?measurementKind(r):null;const field=(name,label,value='',type='number',attrs='')=>`<div><label for="${name}">${label}</label><input id="${name}" type="${type}" value="${value??''}" ${attrs}></div>`;let fields='';if(!kind||kind==='weight')fields+=`<fieldset class="measuregroup"><legend>Weight</legend><p>What was your weight, and when did you last weigh yourself?</p><div class="healthform">${field('weightValue','Weight (kg)',r?.weight,'number','min="1" max="500" step="0.1" placeholder="e.g. 82.5"')}${field('weightDate','Date you weighed yourself',r?.date||'','date',`max="${cairoNow().day}"`)}</div></fieldset>`;if(!kind||kind==='a1c')fields+=`<fieldset class="measuregroup"><legend>HbA1c · السكر التراكمي</legend><p>Enter your latest percentage and the date the test was taken.</p><div class="healthform">${field('a1cValue','HbA1c (%)',r?.a1c,'number','min="1" max="30" step="0.1" placeholder="e.g. 7.2"')}${field('a1cDate','HbA1c test date',r?.date||'','date',`max="${cairoNow().day}"`)}</div></fieldset>`;if(!kind||kind==='bp')fields+=`<fieldset class="measuregroup"><legend>Blood pressure</legend><p>Enter both numbers and when you measured them.</p><div class="healthform">${field('bpSys','Systolic (mmHg)',r?.sys,'number','min="30" max="350" step="1" placeholder="Upper number"')}${field('bpDia','Diastolic (mmHg)',r?.dia,'number','min="20" max="250" step="1" placeholder="Lower number"')}</div>${field('bpDate','Blood-pressure measurement date',r?.date||'','date',`max="${cairoNow().day}"`)}</fieldset>`;modal(`<div class="eyebrow">YOUR MEASUREMENTS · DEMO</div><h2>${id?'Edit measurement':'Add your latest measurements'}</h2><p class="measurementhelp">Each measurement has its own date. They do not need to have been taken on the same day. Fill in what you know and leave other sections blank.</p><form onsubmit="saveHealthReading(event,'${id||''}')">${fields}<p i validateHealthReading=function(r,rows,id){const kind=measurementKind(r),recordId=id?Number(id):undefined;const error=validateMeasurementValues(r,rows.filter(x=>measurementKind(x)===kind),recordId);return error.includes('already exists')?'This measurement already has an entry on that date. Edit it in the history.':error};
saveHealthReading=function(e,id){e.preventDefault();if(!activeAccount)return;const h=healthAccount();const old=id?h.readings.find(r=>r.id===id):null;if(id&&!old)return;const read=name=>{const elem=document.getElementById(name);return elem?elem.value:''};const num=name=>read(name)===''?null:Number(read(name));const groups=old?[measurementKind(old)]:['weight','a1c','bp'];const staged=[];const error=document.getElementById('healthError');error.textContent='';for(const kind of groups){const date=read(kind==='weight'?'weightDate':kind==='a1c'?'a1cDate':'bpDate');const r={id:id||'reading-'+(++healthSequence),kind,date,weight:kind==='weight'?num('weightValue'):null,a1c:kind==='a1c'?num('a1cValue'):null,sys:kind==='bp'?num('bpSys'):null,dia:kind==='bp'?num('bpDia'):null};const hasValue=['weight','a1c','sys','dia'].some(k=>r[k]!==null);if(!hasValue&&!date&&!old)continue;const label=kind==='weight'?'Weight':kind==='a1c'?'HbA1c':'Blood pressure';if(!date){error.textContent=label+': please enter when this measurement was taken.';return}if(!hasValue){error.textContent=label+': enter the measurement value, or clear its date to leave this section blank.';return}const msg=validateHealthReading(r,h.readings,id);if(msg){error.textContent=label+': '+msg;return}staged.push(r)}if(!staged.length){error.textContent='Enter at least one measurement together with its date.';return}if(id){const index=h.readings.findIndex(r=>r.id===id);h.readings[index]=staged[0]}else h.readings.push(...staged);showHealthExample=false;healthRange='all';closeModal();go('Health dashboard');toast('Saved '+staged.length+' measurement'+(staged.length===1?'':'s')+' with their measurement dates.')};

let apiToken=null,remoteBookings=[],clinicPatients=[],clinicCases=[],patientCases=[];
const availabilityCache=new Map();
async function apiRequest(path,options={}){const headers={...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(apiToken?{Authorization:`Bearer ${apiToken}`}:{ }),...(options.headers||{})};const response=await fetch(API_BASE+path,{...options,headers});if(!response.ok){let message=`Request failed (${response.status})`;try{const body=await response.json();message=body.detail||message}catch{}throw new Error(message)}return response.status===204?null:response.json()}
function serverBooking(item){return {id:item.reference,reference:item.reference,provider:item.clinic_id,day:item.date,time:item.time.slice(0,5),status:item.status,patient_name:item.patient_name,owner:activeAccount?.email||'guest'}}

bookingCard=function(item){const provider=demoProviders.find(entry=>entry.id===item.provider);if(!provider)return '';return `<article class="card bookingreceipt"><div class="sectionhead"><span class="bookingref">${escapeText(item.id)}</span>${badge(item.status+' · Demo')}</div><h2>${escapeText(provider.name)}</h2>${mode==='doctor'?`<p><b>Patient:</b> ${escapeText(item.patient_name||'Patient')}</p>`:''}<p class="clinicdetail">${escapeText(provider.address)}<br>${escapeText(dayLabel(item.day))} · ${escapeText(item.time)} Cairo<br>Eye screening consultation · EGP ${provider.fee} (demo)</p>${item.status==='Cancelled'?'<p class="sub">This demo slot has been released.</p>':btn('View details',`viewDemoBooking('${item.id}')`,true)+' '+btn('Cancel',`cancelDemoBooking('${item.id}')`,true)}</article>`}

submitAccount=async function(event){event.preventDefault();const error=document.getElementById('authError');error.textContent='';const form=document.getElementById('accountForm');if(!form.reportValidity())return;const signup=authView==='signup',email=document.getElementById('authEmail').value.trim().toLowerCase(),password=document.getElementById('authPassword').value;const payload={email,password};if(signup){payload.name=document.getElementById('authName').value.trim();payload.phone=normalizePhone(document.getElementById('authPhone').value);if(!validPhone(payload.phone)){error.textContent='Enter a valid Egyptian mobile number.';return}if(password!==document.getElementById('authConfirm').value){error.textContent='Your passwords do not match.';return}}const button=document.getElementById('authSubmit');button.disabled=true;button.textContent='Connecting…';try{const result=await apiRequest(signup?'/auth/register':'/auth/login',{method:'POST',body:JSON.stringify(payload)});apiToken=result.access_token;activeAccount=result.account;clinicDemoSignedIn=false;await loadPatientData();hideAuth();setMode('patient');go('Learn & protect');toast(signup?'Patient profile created and saved.':'Welcome back, '+activeAccount.name.split(' ')[0]+'.')}catch(e){error.textContent=e.message}finally{button.disabled=false;button.textContent=signup?'Create demo account →':'Sign in to demo →'}};

saveHealthReading=async function(event,id){event.preventDefault();if(!activeAccount)return;const read=name=>document.getElementById(name)?.value||'',num=name=>read(name)===''?null:Number(read(name));const groups=id?[measurementKind(healthAccount().readings.find(item=>String(item.id)===String(id)))]:['weight','a1c','bp'];const staged=[];for(const kind of groups){const measured_on=read(kind==='weight'?'weightDate':kind==='a1c'?'a1cDate':'bpDate'),value=num(kind==='weight'?'weightValue':kind==='a1c'?'a1cValue':'bpSys'),diastolic=kind==='bp'?num('bpDia'):null;if(value===null&&!measured_on&&!id)continue;if(value===null||!measured_on){document.getElementById('healthError').textContent='Enter both a measurement and its date.';return}const item={kind,measured_on,value,...(kind==='bp'?{diastolic}:{})};const local={id,kind,date:measured_on,weight:kind==='weight'?value:null,a1c:kind==='a1c'?value:null,sys:kind==='bp'?value:null,dia:diastolic};const message=validateHealthReading(local,healthAccount().readings,id);if(message){document.getElementById('healthError').textContent=message;return}staged.push(item)}if(!staged.length){document.getElementById('healthError').textContent='Enter at least one measurement together with its date.';return}try{if(id)await apiRequest(`/health/readings/${id}`,{method:'PUT',body:JSON.stringify(staged[0])});else await apiRequest('/health/readings/batch',{method:'POST',body:JSON.stringify({readings:staged})});const list=await apiRequest('/health/readings');healthAccount().readings=list.map(serverReading);showHealthExample=false;healthRange='all';closeModal();go(healthFormReturnPage);toast('Measurements saved to your patient profile.')}catch(e){document.getElementById('healthError').textContent=e.message}};

saveContact=async function(event){event.preventDefault();const name=document.getElementById('profileName').value.trim(),email=document.getElementById('profileEmail').value.trim().toLowerCase(),phone=normalizePhone(document.getElementById('profilePhone').value),error=document.getElementById('profileError');if(name.length<2||!validPhone(phone)){error.textContent='Enter a valid name and Egyptian mobile number.';return}try{const result=await apiRequest('/patients/me',{method:'PATCH',body:JSON.stringify({name,email,phone})});syncPatientAccount(result);closeModal();render();toast('Contact details saved.')}catch(e){error.textContent=e.message}};
confirmAwareness=async function(){if(!apiToken){showAuth('signup');return}try{const result=await apiRequest('/patients/me/progress',{method:'PATCH',body:JSON.stringify({awareness_completed:true})});syncPatientAccount(result);go('Health dashboard');toast('Awareness step saved.')}catch(e){toast(e.message)}};
completeResultsDemo=async function(){const state=progressState(),reference=document.getElementById('resultBooking').value;if(state.next!==3||!state.bookings.some(item=>item.id===reference))return;try{const result=await apiRequest('/patients/me/progress',{method:'PATCH',body:JSON.stringify({results_appointment:reference,followup_appointment:null})});syncPatientAccount(result);closeModal();go('My care journey');toast('Demo milestone saved.')}catch(e){toast(e.message)}};
completeFollowupDemo=async function(){const state=progressState();if(state.next!==4||!state.resultBooking)return;try{const result=await apiRequest('/patients/me/progress',{method:'PATCH',body:JSON.stringify({followup_appointment:state.resultBooking.id})});syncPatientAccount(result);closeModal();go('My care journey');toast('Demo care progress saved.')}catch(e){toast(e.message)}};
table=function(){const rows=clinicCases.length?clinicCases.map(item=>({name:item.name,reference:item.id,reason:item.status==='image_uploaded'?'Screening review':item.status,status:item.status,type:'case'})):clinicPatients.map(item=>({name:item.name,reference:'Patient '+item.id,reason:'Patient profile',status:'Active',type:'patient',id:item.id}));return `<div class="tablewrap"><table><thead><tr><th>PATIENT</th><th>REFERENCE</th><th>REASON FOR VISIT</th><th>STATUS</th><th></th></tr></thead><tbody>${rows.map(row=>`<tr><td>${escapeText(row.name)}</td><td>${escapeText(String(row.reference))}</td><td>${escapeText(row.reason)}</td><td>${badge(escapeText(row.status))}</td><td><button onclick="openClinicRecord('${row.type}',${row.type==='case'?row.reference:row.id})">View →</button></td></tr>`).join('')||'<tr><td colspan="5">No patient records yet.</td></tr>'}</tbody></table></div>`};
function openClinicRecord(type,id){if(type==='case'){const item=clinicCases.find(record=>record.id===id);if(!item)return;modal(`<div class="eyebrow">SCREENING RECORD · DEMO</div><h2>${escapeText(item.name)}</h2><p>Case ${item.id} · ${escapeText(item.status)}</p><p>${item.prediction?escapeText(item.prediction):'No result has been added.'}</p><p class="notice">Image analysis is not connected. This record is not a diagnosis.</p>`);return}const item=clinicPatients.find(record=>record.id===id);if(!item)return;modal(`<div class="eyebrow">PATIENT PROFILE</div><h2>${escapeText(item.name)}</h2><p>${escapeText(item.email)}<br>${escapeText(item.phone)}</p><p>Diabetes type: ${escapeText(item.diabetes_type)}</p><p class="notice">Use the patient’s screening records and appointment history to coordinate follow-up.</p>`)}
uploadScreen=async function(){if(!apiToken||mode!=='doctor'){toast('Sign in to the clinic portal first.');return}try{clinicPatients=await apiRequest('/clinic/patients');const options=clinicPatients.map(item=>`<option value="${item.id}">${escapeText(item.name)} · ${escapeText(item.email)}</option>`).join('');if(!options){toast('Create a patient account before adding a screening.');return}modal(`<div class="eyebrow">CLINIC SCREENING</div><h2>New screening record</h2><form onsubmit="submitScreening(event)"><label for="screenPatient">Patient</label><select id="screenPatient" required>${options}</select><label for="retinal">Choose a retinal image</label><input id="retinal" type="file" accept="image/jpeg,image/png" required onchange="previewImage(this)"><div id="imagepreview"></div><p class="notice">The image will be stored with this patient’s record. No AI analysis or diagnosis is generated.</p><button class="primary">Save screening image</button></form>`)}catch(e){toast(e.message)}};
async function submitScreening(event){event.preventDefault();const file=document.getElementById('retinal').files[0];if(!file)return;const form=new FormData();form.append('patient_id',document.getElementById('screenPatient').value);form.append('image',file);try{await apiRequest('/cases',{method:'POST',body:form});clinicCases=await apiRequest('/cases');closeModal();render();toast('Screening image saved to the patient record.')}catch(e){toast(e.message)}}
const renderBeforeServerSync=render;
screening=function(){const item=patientCases[0];if(!item){modal('<h2>No screening record yet</h2><p>Your clinic has not added a screening image to your account.</p>');return}modal(`<div class="eyebrow">SCREENING RECORD</div><h2>${escapeText(item.status.replaceAll('_',' '))}</h2><p>Reference RG-${item.id} · ${escapeText(item.created_at)}</p><p>${item.prediction?escapeText(item.prediction):'Your clinic has not added a result yet.'}</p><p class="notice">RetinaGuard does not generate a diagnosis. Discuss screening results with your eye care professional.</p>`)};
render=function(){renderBeforeServerSync();if(mode==='doctor'&&page==='Appointments'){document.getElementById('app').innerHTML=heading('Appointments','Appointments saved by patients in the portal.')+`<div class="appointmentlist">${remoteBookings.map(bookingCard).join('')||'<div class="card bookingempty">No appointments have been booked.</div>'}</div>`}if(mode==='doctor'&&(page==='Patients'||page==='Referrals'))document.getElementById('app').innerHTML=heading(page,'Manage patient records and screening referrals.',btn('＋ New screening','uploadScreen()'))+`<div class="card">${table()}</div>`;if(mode==='patient'&&page==='Overview'&&patientCases.length){document.getElementById('app').insertAdjacentHTML('beforeend',`<section class="card" style="margin-top:20px"><div class="sectionhead"><h2>Your screening records</h2><button class="textbutton" onclick="screening()">Latest details →</button></div>${patientCases.map(item=>`<div class="detailrow"><span>Screening RG-${item.id} · ${escapeText(item.created_at)}</span>${badge(escapeText(item.status.replaceAll('_',' ')))}</div>`).join('')}</section>`)}};
const renderWithScreeningRecords=render;
render=function(){renderWithScreeningRecords();if(mode!=='patient'||page!=='Overview')return;const latest=patientCases[0],screeningStat=document.querySelector('.grid3 .stat'),screeningCard=document.querySelector('.layout .card'),result=screeningCard?.querySelector('.result'),date=screeningCard?.querySelector('.sectionhead .sub'),details=screeningCard?.querySelector('.detailrow');if(screeningStat)screeningStat.querySelector('strong').textContent=latest?latest.created_at.split(' at ')[0]:'No record';if(date)date.textContent=latest?latest.created_at:'No screening recorded';if(result)result.innerHTML=latest?`<span class="iconbox">◎</span><div><h3>Screening image received</h3><p>Your clinic uploaded a screening image. Ask your eye care professional to explain any results and recommended next steps.</p><small>Image upload only · No AI analysis or diagnosis</small></div>`:'<div><h3>No screening record yet</h3><p>A screening record will appear here after your clinic uploads an image to your account.</p><small>No result or diagnosis is available.</small></div>';if(details)details.innerHTML=latest?`<span>Screening reference &nbsp; <b>RG-${latest.id}</b></span><button class="textbutton" onclick="screening()">View details ↗</button>`:'<span>No screening has been uploaded to your account.</span>'};
fetch(API_BASE+'/clinics').then(response=>response.ok?response.json():[]).then(items=>{if(items.length){demoProviders.splice(0,demoProviders.length,...items.map(item=>({id:item.id,name:item.name,area:item.area,address:item.address,lat:item.latitude,lng:item.longitude,fee:item.fee,hours:item.hours,specialty:item.specialty})));if(page==='Find clinics')render()}}).catch(()=>{});
render();showAuth('signup');
const patientChatScript=document.createElement('script');patientChatScript.src='chat.js';document.body.append(patientChatScript);
</script></body></html>
